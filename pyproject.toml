[project]
name = "elenchus"
version = "0.1.0"
description = "Verification layer for computer-use agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "playwright>=1.45",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[project.scripts]
elenchus = "elenchus.cli:main"
elen = "elenchus.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elenchus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
