name: attribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages in the PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_attribution.sh range "$BASE_SHA" "$HEAD_SHA"
      - name: PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/check_attribution.sh text
      - name: Commit messages in the push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/check_attribution.sh range "$BEFORE_SHA" "$AFTER_SHA"
      - name: Files in the tree
        run: bash scripts/check_attribution.sh tree
