<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Mock ERP{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
    .field { margin: 0.5rem 0; }
    .field label { display: inline-block; min-width: 8rem; }
    .sizes { display: inline-flex; gap: 0.5rem; }
    .sizes input { width: 4rem; }
    .buttons { margin-top: 1rem; display: flex; gap: 0.5rem; }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.25rem 0.5rem; text-align: left; }
    .readonly { color: #555; }
  </style>
</head>
<body>
  <nav><a href="/{{ vq }}">Orders</a> · <a href="/orders/new{{ vq }}">New order</a></nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
